# suppress inspection "UnusedProperty" for whole file
spring.datasource.url=${MYSQL_DB_URL}
spring.datasource.username=${MYSQL_DB_USER}
spring.datasource.password=${MYSQL_DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Schema is owned by Flyway (src/main/resources/db/migration), not Hibernate.
# `none` stops Hibernate from touching the schema; ALL structural changes — new tables/columns
# and especially unique constraints/indexes — go through versioned migrations. This replaces the
# old `ddl-auto=update`, which added missing columns but did NOT reliably create/alter constraints
# across vendors (e.g. Store's uk_store_location_type_department_courier). Such constraints are now
# guaranteed by migrations (see V3__ensure_named_unique_constraints.sql), so the previous "verify
# the constraint on the dev/prod DB by hand after deploying" step is no longer needed.
#
# Adding a new @UniqueConstraint / column now? Write a Vn__*.sql migration for it — do not rely on
# Hibernate. (To also enable Hibernate's drift check, switch to `validate` once the baseline is
# trusted; leave as `none` until then.)
spring.jpa.hibernate.ddl-auto=none

# Flyway: adopt the current (already-populated) schema as the baseline (V1), then apply V2+ forward.
# NOTE: a brand-new/empty DB has no base tables and ddl-auto=none won't create them — bootstrap once
# with ddl-auto=update (then switch back to none) or add a V1__baseline.sql full-schema migration.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=existing schema baseline
# Data seeding stays in Java (e.g. StatusSeeder); Flyway owns schema only.
application.security.jwt.secret-key=${JWT_SECRET_KEY}
# In milliseconds (10 Minute)
application.security.jwt.expiration=3600000
# In milliseconds (20 Minutes)
application.security.jwt.refresh-token.expiration=1200000
server.port=${APPLICATION_PORT}
# SMTP transport. Defaults below target Gmail (smtp.gmail.com:587, STARTTLS) so
# the app starts cleanly even when the SMTP env vars are unset. Override any
# value in .env to point at a different provider (e.g. corporate mail server).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER_NAME}
# For Gmail this MUST be an App Password (16 chars, no spaces), not the account
# password. Generate one at https://myaccount.google.com/apppasswords with 2FA enabled.
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
# Avoids "Failed to close server connection after message sending" on some providers.
spring.mail.properties.mail.smtp.quitwait=${MAIL_SMTP_STARTTLS_QUIT_WAIT:false}
# Trust the SMTP host's TLS cert. Defaults to Gmail; change with MAIL_SMTP_SSL_TRUST.
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:smtp.gmail.com}
# Fail fast on a dead SMTP host instead of letting a thread hang for minutes.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}
# Gmail rewrites the From: header to the authenticated account anyway, so keeping
# this bound to the SMTP username avoids confusing mismatches.
mail.sender.from=${MAIL_USER_NAME}
application.verification.url=${ACCOUNT_VERIFICATION_URL}
#Super admin information
application.super.admin.email=${SUPER_ADMIN_EMAIL}
application.super.admin.password=${SUPER_ADMIN_PASSWORD}
application.super.admin.first.name=${SUPER_ADMIN_FIRST_NAME}
application.super.admin.last.name=${SUPER_ADMIN_LAST_NAME}
application.super.admin.duty.station=${SUPER_ADMIN_DUTY_STATION}
#Admin information
application.admin.email=${ADMIN_EMAIL}
application.admin.password=${ADMIN_PASSWORD}
application.admin.first.name=${ADMIN_FIRST_NAME}
application.admin.last.name=${ADMIN_LAST_NAME}
application.admin.reporting.office=${SUPER_ADMIN_REPORTING_OFFICE}
#Head Office Information
application.head.office.name=Head Office
application.head.office.email=${HEAD_OFFICE_EMAIL}
application.head.office.telephone=${HEAD_OFFICE_TELEPHONE}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
images.upload-dir=${UPLOAD_DIR}
front-end.environment=${FRONT_END_URL}
it-team.email.address=${IT_TEAM_EMAIL_ADDRESS}
admin-team.email.address=${ADMIN_TEAM_EMAIL_ADDRESS}
# Log everything under your app's base package (adjust this if needed)
logging.level.pride.bank.erp.stock=DEBUG
# Optional: Show all logs from your entire app (can be noisy)
# logging.level.pride.bank.erp=DEBUG
# Set the root logger level
logging.level.root=INFO
# Optional: Enable Spring Web logs (not needed if only focusing on your controller)
logging.level.org.springframework.web=DEBUG
# Console pattern (optional, customize formatting if needed)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=DEBUG
logging.level.org.springframework.boot.autoconfigure.web=DEBUG
