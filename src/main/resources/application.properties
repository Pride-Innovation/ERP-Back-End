# suppress inspection "UnusedProperty" for whole file
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
application.security.jwt.secret-key=${JWT_SECRET_KEY}
# In milliseconds (10 Minute)
application.security.jwt.expiration=3600000
# In milliseconds (20 Minutes)
application.security.jwt.refresh-token.expiration=1200000
server.port=${APPLICATION_PORT}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER_NAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
# org.springframework.mail.MailSendException:
# Failed to close server connection after message sending
spring.mail.properties.mail.smtp.quitwait=false
mail.sender.from=${MAIL_USER_NAME}
application.verification.url=${ACCOUNT_VERIFICATION_URL}
#Super admin information
application.super.admin.email=${SUPER_ADMIN_EMAIL}
application.super.admin.password=${SUPER_ADMIN_PASSWORD}
application.super.admin.first.name=${SUPER_ADMIN_FIRST_NAME}
application.super.admin.last.name=${SUPER_ADMIN_LAST_NAME}
application.super.admin.duty.station=${SUPER_ADMIN_DUTY_STATION}
#Admin information
application.admin.email=${ADMIN_EMAIL}
application.admin.password=${ADMIN_PASSWORD}
application.admin.first.name=${ADMIN_FIRST_NAME}
application.admin.last.name=${ADMIN_LAST_NAME}
application.admin.reporting.office=${SUPER_ADMIN_REPORTING_OFFICE}
#Head Office Information
application.head.office.name=Head Office
application.head.office.email=${HEAD_OFFICE_EMAIL}
application.head.office.telephone=${HEAD_OFFICE_TELEPHONE}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
images.upload-dir=${UPLOAD_DIR}
front-end.environment=${FRONT_END_URL}
# Log everything under your app's base package (adjust this if needed)
logging.level.pride.bank.erp.stock=DEBUG
# Optional: Show all logs from your entire app (can be noisy)
# logging.level.pride.bank.erp=DEBUG
# Set the root logger level
logging.level.root=INFO
# Optional: Enable Spring Web logs (not needed if only focusing on your controller)
logging.level.org.springframework.web=DEBUG
# Console pattern (optional, customize formatting if needed)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=DEBUG
logging.level.org.springframework.boot.autoconfigure.web=DEBUG
